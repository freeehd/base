name: Refresh npm lockfile for security update

on:
  push:
    branches: [security/dependency-updates-bot-guards]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/security/dependency-updates-bot-guards'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
      - name: Verify install
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate npm lockfile with patched dependencies"
            git push
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
